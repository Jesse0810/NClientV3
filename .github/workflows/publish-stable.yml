name: Publish signed stable APKs

on:
  push:
    branches:
      - 'release-assets/v*'

permissions:
  contents: read

concurrency:
  group: publish-stable-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release transfer branch
        id: tag
        env:
          TRANSFER_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TRANSFER_BRANCH" =~ ^release-assets/(v([0-9]+\.[0-9]+\.[0-9]+))$ ]]; then
            echo 'Expected a release-assets/vX.Y.Z branch' >&2
            exit 1
          fi
          echo "tag=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${BASH_REMATCH[2]}" >> "$GITHUB_ENV"

      - name: Checkout signed public transfer files
        uses: actions/checkout@v7
        with:
          path: transfer
          sparse-checkout: release-uploads
          persist-credentials: false

      - name: Checkout approved formal tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Validate transfer manifest and file set
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          tag = os.environ['RELEASE_TAG']
          folder = Path('transfer/release-uploads')
          expected = {
              f'NClientV3_{tag}_android9plus.apk',
              f'NClientV3_{tag}_android8.apk',
              'SHA256SUMS.txt',
              'manifest.json',
          }
          if not folder.is_dir() or {path.name for path in folder.iterdir()} != expected:
              raise SystemExit('Transfer directory must contain only two signed APKs, checksums and manifest.json')
          if any(path.is_symlink() or not path.is_file() for path in folder.iterdir()):
              raise SystemExit('Transfer entries must be ordinary files')
          manifest = json.loads((folder / 'manifest.json').read_text())
          if not isinstance(manifest, dict) or set(manifest) != {'tag', 'source_commit'}:
              raise SystemExit('Expected manifest keys: tag and source_commit')
          if manifest['tag'] != tag or not isinstance(manifest['source_commit'], str):
              raise SystemExit('Transfer manifest does not match the formal tag')
          if not re.fullmatch(r'[0-9a-f]{40}', manifest['source_commit']):
              raise SystemExit('Expected a full source commit SHA')
          actual_commit = subprocess.check_output(['git', '-C', 'source', 'rev-parse', 'HEAD'], text=True).strip()
          if manifest['source_commit'] != actual_commit:
              raise SystemExit('Transfer source commit differs from the approved formal tag')
          notes = Path('source/docs/releases') / f'{tag}.md'
          if not notes.is_file() or not notes.stat().st_size:
              raise SystemExit('Missing tagged release notes')
          print(f'Verified transfer manifest: {tag} at {actual_commit}')
          PY

      - name: Set up JDK 17 for signature verification
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '17'
          distribution: temurin

      - name: Verify fixed signatures and tagged APK contents
        run: |
          python3 source/scripts/verify_release_apks.py --version "$RELEASE_VERSION" --signed \
            --apk-dir transfer/release-uploads --report "$RUNNER_TEMP/transfer-verification.json"

      - name: Upload to empty draft, verify downloaded files and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_metadata="$RUNNER_TEMP/stable-release.json"
          release_error="$RUNNER_TEMP/stable-release-error.txt"
          if ! gh release view "$RELEASE_TAG" --json tagName,isDraft,assets > "$release_metadata" 2> "$release_error"; then
            if ! grep -Eq 'HTTP 404|release not found' "$release_error"; then
              cat "$release_error" >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease=false \
              --title "$RELEASE_TAG · 简体中文正式版" \
              --notes-file "source/docs/releases/$RELEASE_TAG.md"
            gh release view "$RELEASE_TAG" --json tagName,isDraft,assets > "$release_metadata"
          fi
          RELEASE_METADATA="$release_metadata" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(Path(os.environ['RELEASE_METADATA']).read_text())
          if release.get('tagName') != os.environ['RELEASE_TAG'] or release.get('isDraft') is not True:
              raise SystemExit('Refusing to modify a published release or a different tag')
          if release.get('assets') != []:
              raise SystemExit('Refusing to replace existing release assets')
          PY
          gh release upload "$RELEASE_TAG" \
            "transfer/release-uploads/NClientV3_${RELEASE_TAG}_android9plus.apk" \
            "transfer/release-uploads/NClientV3_${RELEASE_TAG}_android8.apk" \
            transfer/release-uploads/SHA256SUMS.txt
          gh release view "$RELEASE_TAG" --json tagName,isDraft,assets > "$release_metadata"
          RELEASE_METADATA="$release_metadata" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          release = json.loads(Path(os.environ['RELEASE_METADATA']).read_text())
          expected = {f'NClientV3_{tag}_android9plus.apk', f'NClientV3_{tag}_android8.apk', 'SHA256SUMS.txt'}
          assets = release.get('assets', [])
          if release.get('isDraft') is not True or len(assets) != 3 or {asset['name'] for asset in assets} != expected:
              raise SystemExit('Uploaded draft assets differ from the expected final file set')
          if any(asset.get('state') != 'uploaded' or not asset.get('size') for asset in assets):
              raise SystemExit('An uploaded asset is incomplete')
          PY
          download_dir="$RUNNER_TEMP/downloaded-stable-release"
          mkdir "$download_dir"
          gh release download "$RELEASE_TAG" --dir "$download_dir"
          cmp transfer/release-uploads/SHA256SUMS.txt "$download_dir/SHA256SUMS.txt"
          python3 source/scripts/verify_release_apks.py --version "$RELEASE_VERSION" --signed \
            --apk-dir "$download_dir" --report "$RUNNER_TEMP/downloaded-verification.json"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
