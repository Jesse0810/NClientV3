name: Android CI

on:
    push:
        branches:
            - 'main'
    pull_request:
        branches:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout sources
                uses: actions/checkout@v7

            -   name: set up JDK 17
                uses: actions/setup-java@v6.1.0
                with:
                    java-version: '17'
                    distribution: 'temurin'
                    cache: gradle

            -   name: Grant execute permission for gradlew
                run: chmod +x gradlew

            -   name: Check bookmark migration and saved queries
                run: python3 scripts/check_bookmarks.py

            -   name: Check entity display names and complete inventory
                run: python3 scripts/check_entity_translations.py

            -   name: Check duplicate labels and disambiguation index
                run: python3 scripts/check_translation_collisions.py --check

            -   name: Check reviewed content labels and spelling groups
                run: python3 scripts/check_content_label_review.py

            -   name: Check alias selection and exclusion regressions
                run: python3 scripts/check_content_aliases.py

            -   name: Add empty keystore.properties
                run: |
                    echo "storePassword=dummy" > keystore.properties
                    echo "keyPassword=dummy" >> keystore.properties
                    echo "keyAlias=dummy" >> keystore.properties
                    echo "storeFile=dummy.jks" >> keystore.properties

            -   name: Assemble Debug with Gradle
                run: ./gradlew assembleDebug

            -   name: Bundle Debug with Gradle
                run: ./gradlew bundleDebug

            -   name: Upload Artifact
                uses: actions/upload-artifact@v7
                with:
                    name: Debug APKs
                    path: app/build/outputs/apk/
                    retention-days: 30
